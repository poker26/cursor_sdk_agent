<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cursor Agent</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, sans-serif;
        color: #e8eaed;
        background: #0f1114;
        --user-bg: #1a3a5c;
        --agent-bg: #1e2228;
        --border: #2d333b;
        --accent: #58a6ff;
        --muted: #8b949e;
        --error: #f85149;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1rem;
        border-bottom: 1px solid var(--border);
        background: #161b22;
        flex-shrink: 0;
      }
      header h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        margin-right: auto;
      }
      #status-pill {
        font-size: 0.75rem;
        color: var(--muted);
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        border: 1px solid var(--border);
      }
      #status-pill.busy {
        color: #f0c674;
        border-color: #6b5a20;
      }
      #status-pill.error {
        color: var(--error);
        border-color: #6e3030;
      }
      #vpn-indicator {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.3rem 0.6rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        flex-shrink: 0;
        user-select: none;
      }
      #vpn-indicator .vpn-dot {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      #vpn-indicator.unknown .vpn-dot {
        background: #8b949e;
        box-shadow: 0 0 6px #8b949e88;
      }
      #vpn-indicator.ok {
        border-color: #238636;
        background: rgba(35, 134, 54, 0.18);
        color: #7ee787;
      }
      #vpn-indicator.ok .vpn-dot {
        background: #3fb950;
        box-shadow: 0 0 10px #3fb950cc;
      }
      #vpn-indicator.down {
        border-color: #8b2e2e;
        background: rgba(248, 81, 73, 0.14);
        color: #ffb4af;
      }
      #vpn-indicator.down .vpn-dot {
        background: #f85149;
        box-shadow: 0 0 10px #f85149cc;
        animation: vpn-blink 1.2s ease-in-out infinite;
      }
      @keyframes vpn-blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        align-items: center;
      }
      #workspace-select {
        font: inherit;
        font-size: 0.8rem;
        padding: 0.35rem 0.5rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #0d1117;
        color: #e6edf3;
        max-width: 14rem;
      }
      .toolbar button {
        font: inherit;
        font-size: 0.8rem;
        padding: 0.35rem 0.65rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #21262d;
        color: #e6edf3;
        cursor: pointer;
      }
      .toolbar button:hover:not(:disabled) {
        background: #30363d;
      }
      .toolbar button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .msg {
        max-width: 92%;
        padding: 0.65rem 0.85rem;
        border-radius: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.92rem;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--user-bg);
        border-bottom-right-radius: 4px;
      }
      .msg.agent {
        align-self: flex-start;
        background: var(--agent-bg);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }
      .msg.system {
        align-self: center;
        font-size: 0.78rem;
        color: var(--muted);
        background: transparent;
        padding: 0.25rem;
      }
      .msg.error {
        align-self: stretch;
        background: #3d1f1f;
        border: 1px solid #6e3030;
        color: #ffb4af;
      }
      .tool-hint {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 0.35rem;
      }
      .attach-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin-bottom: 0.35rem;
      }
      .attach-chip {
        font-size: 0.75rem;
        padding: 0.15rem 0.45rem;
        border-radius: 999px;
        background: #21262d;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      footer {
        border-top: 1px solid var(--border);
        padding: 0.75rem 1rem;
        background: #161b22;
        flex-shrink: 0;
      }
      #composer {
        display: flex;
        gap: 0.5rem;
        align-items: flex-end;
      }
      #composer-side {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      #attach-input {
        display: none;
      }
      #input {
        flex: 1;
        min-height: 2.75rem;
        max-height: 10rem;
        resize: vertical;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #0d1117;
        color: #e6edf3;
        padding: 0.55rem 0.7rem;
        font: inherit;
        line-height: 1.4;
      }
      #send {
        flex-shrink: 0;
        padding: 0.55rem 1rem;
        border-radius: 8px;
        border: none;
        background: var(--accent);
        color: #0d1117;
        font-weight: 600;
        cursor: pointer;
      }
      #send:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #voice-record {
        flex-shrink: 0;
        padding: 0.55rem 0.75rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #21262d;
        color: #e6edf3;
        cursor: pointer;
        font-size: 1.1rem;
        line-height: 1;
      }
      #voice-record:hover:not(:disabled) {
        background: #30363d;
      }
      #voice-record:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #voice-record.recording {
        border-color: #8b2e2e;
        background: rgba(248, 81, 73, 0.2);
        animation: vpn-blink 1s ease-in-out infinite;
      }
      .msg.agent {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 0.4rem;
      }
      .msg.agent .msg-text {
        flex: 1 1 auto;
        min-width: 0;
        white-space: pre-wrap;
      }
      .speak-btn {
        flex-shrink: 0;
        font: inherit;
        font-size: 0.85rem;
        min-width: 2rem;
        padding: 0.15rem 0.45rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #21262d;
        color: #e6edf3;
        cursor: pointer;
        align-self: flex-start;
      }
      .speak-btn:hover:not(:disabled) {
        background: #30363d;
      }
      .speak-btn:disabled {
        opacity: 0.45;
      }
      .speak-btn.speak-loading {
        opacity: 0.75;
        cursor: wait;
      }
      .speak-btn.speak-playing {
        border-color: #58a6ff;
        background: #1a3a5c;
        color: #79c0ff;
        box-shadow: 0 0 0 1px #388bfd66;
      }
    </style>
  </head>
  <body>
    <header>
      <div
        id="vpn-indicator"
        class="vpn-indicator unknown"
        role="status"
        aria-live="polite"
        title="VPN: проверка…"
      >
        <span class="vpn-dot" aria-hidden="true"></span>
        <span class="vpn-label">VPN</span>
      </div>
      <h1>Cursor Agent</h1>
      <select id="workspace-select" title="Рабочая папка агента (репозиторий)"></select>
      <span id="status-pill">готов</span>
      <div class="toolbar">
        <button type="button" id="attach-btn" title="Прикрепить файл">📎</button>
        <button type="button" id="new-chat" title="Новая вкладка UI, память workspace сохраняется">Новая вкладка</button>
        <button type="button" id="reset-agent" title="Сбросить зависший агент (active run) без удаления памяти">Сбросить агента</button>
        <button type="button" id="reset-memory" title="Очистить memory.md, Supabase, Qdrant и пересоздать агента">Сбросить память</button>
      </div>
    </header>

    <div id="messages" aria-live="polite"></div>

    <footer>
      <div id="attach-list" class="attach-list"></div>
      <div id="composer">
        <button
          type="button"
          id="voice-record"
          hidden
          title="Голос: нажмите — запись, ещё раз — стоп и отправить"
        >
          🎤
        </button>
        <textarea id="input" rows="2" placeholder="Сообщение… (Enter — отправить)"></textarea>
        <div id="composer-side">
          <input type="file" id="attach-input" multiple />
          <button type="button" id="send">Отправить</button>
        </div>
      </div>
    </footer>

    <script>
      const SESSION_STORAGE_KEY = "cursor_sdk_chat_session_id";
      const WORKSPACE_STORAGE_KEY = "cursor_sdk_chat_workspace_id";
      const HISTORY_STORAGE_KEY = "cursor_sdk_chat_history_v1";

      const messagesElement = document.getElementById("messages");
      const inputElement = document.getElementById("input");
      const sendButton = document.getElementById("send");
      const newChatButton = document.getElementById("new-chat");
      const resetAgentButton = document.getElementById("reset-agent");
      const resetMemoryButton = document.getElementById("reset-memory");
      const attachButton = document.getElementById("attach-btn");
      const attachInputElement = document.getElementById("attach-input");
      const attachListElement = document.getElementById("attach-list");
      const workspaceSelectElement = document.getElementById("workspace-select");
      const statusPillElement = document.getElementById("status-pill");
      const vpnIndicatorElement = document.getElementById("vpn-indicator");
      const voiceRecordButton = document.getElementById("voice-record");

      let chatSessionId = localStorage.getItem(SESSION_STORAGE_KEY) || "";
      let selectedWorkspaceId = localStorage.getItem(WORKSPACE_STORAGE_KEY) || "";
      let uploadMaxBytes = 3 * 1024 * 1024;
      let isRequestInFlight = false;
      let currentAgentBubbleElement = null;
      let pendingAttachments = [];
      let vpnHealthPollIntervalMs = 20000;
      let vpnHealthPollTimer = null;
      let voiceEnabled = false;
      let voiceAutoSend = true;
      let voiceMediaRecorder = null;
      let voiceRecordingStream = null;
      let voiceRecordedChunks = [];
      let isVoiceRecording = false;
      let currentSpeechAudio = null;
      let currentSpeechObjectUrl = null;
      let activeSpeakButtonElement = null;
      let speechFetchAbortController = null;

      function persistSessionId(sessionId) {
        chatSessionId = sessionId;
        localStorage.setItem(SESSION_STORAGE_KEY, sessionId);
      }

      function persistWorkspaceId(workspaceId) {
        selectedWorkspaceId = workspaceId;
        localStorage.setItem(WORKSPACE_STORAGE_KEY, workspaceId);
      }

      function setStatus(label, mode) {
        statusPillElement.textContent = label;
        statusPillElement.className = mode || "";
      }

      function updateVpnIndicator(probePayload) {
        const isVpnOk = Boolean(probePayload && probePayload.ok);
        vpnIndicatorElement.className = isVpnOk ? "vpn-indicator ok" : "vpn-indicator down";
        const checkedAtLabel =
          probePayload && probePayload.checkedAt
            ? new Date(probePayload.checkedAt).toLocaleTimeString()
            : "";
        if (isVpnOk) {
          vpnIndicatorElement.title =
            "VPN: доступен (Atlassian MCP health OK)" +
            (checkedAtLabel ? " · " + checkedAtLabel : "");
        } else {
          const errorHint =
            probePayload && probePayload.error ? probePayload.error : "нет ответа";
          vpnIndicatorElement.title =
            "VPN: недоступен — " + errorHint + (checkedAtLabel ? " · " + checkedAtLabel : "");
        }
      }

      function setVpnIndicatorChecking() {
        vpnIndicatorElement.className = "vpn-indicator unknown";
        vpnIndicatorElement.title = "VPN: проверка…";
      }

      async function pollVpnHealthOnce() {
        try {
          const healthResponse = await fetch("/api/vpn-health");
          const probePayload = await healthResponse.json();
          updateVpnIndicator(probePayload);
        } catch (fetchError) {
          updateVpnIndicator({
            ok: false,
            error: fetchError instanceof Error ? fetchError.message : "ошибка запроса",
          });
        }
      }

      function startVpnHealthPolling() {
        if (vpnHealthPollTimer) {
          clearInterval(vpnHealthPollTimer);
        }
        setVpnIndicatorChecking();
        void pollVpnHealthOnce();
        vpnHealthPollTimer = setInterval(() => {
          void pollVpnHealthOnce();
        }, vpnHealthPollIntervalMs);
      }

      function scrollMessagesToBottom() {
        messagesElement.scrollTop = messagesElement.scrollHeight;
      }

      function loadHistoryFromStorage() {
        try {
          const raw = localStorage.getItem(HISTORY_STORAGE_KEY);
          if (!raw) {
            return [];
          }
          const parsed = JSON.parse(raw);
          if (!parsed || parsed.sessionId !== chatSessionId || !Array.isArray(parsed.messages)) {
            return [];
          }
          return parsed.messages;
        } catch {
          return [];
        }
      }

      function saveHistoryToStorage() {
        const messageNodes = messagesElement.querySelectorAll(".msg");
        const messages = [];
        for (const node of messageNodes) {
          const roleClass = node.className.replace("msg ", "").trim();
          if (roleClass === "system") {
            continue;
          }
          const savedTextElement = node.querySelector(".msg-text");
          messages.push({
            role: roleClass,
            text: savedTextElement ? savedTextElement.textContent || "" : node.textContent || "",
          });
        }
        localStorage.setItem(
          HISTORY_STORAGE_KEY,
          JSON.stringify({ sessionId: chatSessionId, messages }),
        );
      }

      function renderHistoryMessages(messages) {
        messagesElement.innerHTML = "";
        currentAgentBubbleElement = null;
        for (const entry of messages) {
          if (entry.role === "agent" && currentAgentBubbleElement) {
            const historyTextElement = getAgentBubbleTextElement(currentAgentBubbleElement);
            if (historyTextElement) {
              historyTextElement.textContent += entry.text;
            }
          } else {
            currentAgentBubbleElement = null;
            appendMessageBubble(entry.role, entry.text);
            if (entry.role === "agent") {
              currentAgentBubbleElement = messagesElement.lastElementChild;
            }
          }
        }
        currentAgentBubbleElement = null;
      }

      function getAgentBubbleTextElement(agentBubbleElement) {
        if (!agentBubbleElement) {
          return null;
        }
        return agentBubbleElement.querySelector(".msg-text") || agentBubbleElement;
      }

      function resetAllSpeakButtonVisuals() {
        const speakButtons = messagesElement.querySelectorAll(".speak-btn");
        for (const speakButton of speakButtons) {
          speakButton.classList.remove("speak-loading", "speak-playing");
          speakButton.textContent = "🔊";
          speakButton.title = "Озвучить ответ (повторное нажатие — стоп)";
          speakButton.disabled = false;
        }
      }

      function setSpeakButtonVisual(speakButtonElement, visualState) {
        speakButtonElement.classList.remove("speak-loading", "speak-playing");
        if (visualState === "loading") {
          speakButtonElement.classList.add("speak-loading");
          speakButtonElement.textContent = "…";
          speakButtonElement.title = "Готовим озвучку…";
          return;
        }
        if (visualState === "playing") {
          speakButtonElement.classList.add("speak-playing");
          speakButtonElement.textContent = "⏹";
          speakButtonElement.title = "Остановить озвучку";
          return;
        }
        speakButtonElement.textContent = "🔊";
        speakButtonElement.title = "Озвучить ответ (повторное нажатие — стоп)";
      }

      function stopSpeechPlayback() {
        if (speechFetchAbortController) {
          speechFetchAbortController.abort();
          speechFetchAbortController = null;
        }
        if (currentSpeechAudio) {
          currentSpeechAudio.pause();
          currentSpeechAudio.removeAttribute("src");
          currentSpeechAudio.load();
          currentSpeechAudio = null;
        }
        if (currentSpeechObjectUrl) {
          URL.revokeObjectURL(currentSpeechObjectUrl);
          currentSpeechObjectUrl = null;
        }
        activeSpeakButtonElement = null;
        resetAllSpeakButtonVisuals();
        if (!isRequestInFlight && !isVoiceRecording) {
          setStatus("готов", "");
        }
      }

      function bindSpeakButton(speakButtonElement, textElement) {
        speakButtonElement.addEventListener("click", () => {
          speakButtonElement.blur();
          void handleSpeakButtonClick(speakButtonElement, textElement);
        });
      }

      async function handleSpeakButtonClick(speakButtonElement, textElement) {
        if (!voiceEnabled) {
          return;
        }
        const messageText = (textElement.textContent || "").trim();
        if (!messageText) {
          return;
        }

        if (
          activeSpeakButtonElement === speakButtonElement &&
          (currentSpeechAudio || speechFetchAbortController)
        ) {
          stopSpeechPlayback();
          return;
        }

        stopSpeechPlayback();
        activeSpeakButtonElement = speakButtonElement;
        setSpeakButtonVisual(speakButtonElement, "loading");
        setStatus("озвучивание…", "busy");

        speechFetchAbortController = new AbortController();
        const fetchSignal = speechFetchAbortController.signal;

        try {
          const synthesizeResponse = await fetch("/api/voice/synthesize", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: messageText }),
            signal: fetchSignal,
          });

          if (activeSpeakButtonElement !== speakButtonElement) {
            return;
          }

          if (!synthesizeResponse.ok) {
            const errorPayload = await synthesizeResponse.json().catch(() => ({}));
            appendMessageBubble(
              "error",
              errorPayload.error || "Не удалось синтезировать речь",
            );
            stopSpeechPlayback();
            setStatus("ошибка", "error");
            return;
          }

          const audioBlob = await synthesizeResponse.blob();
          if (activeSpeakButtonElement !== speakButtonElement) {
            return;
          }

          currentSpeechObjectUrl = URL.createObjectURL(audioBlob);
          const audioElement = new Audio(currentSpeechObjectUrl);
          currentSpeechAudio = audioElement;
          speechFetchAbortController = null;

          setSpeakButtonVisual(speakButtonElement, "playing");

          audioElement.onended = () => {
            if (currentSpeechAudio === audioElement) {
              stopSpeechPlayback();
            }
          };

          await audioElement.play();
        } catch (playbackError) {
          if (playbackError && playbackError.name === "AbortError") {
            return;
          }
          if (activeSpeakButtonElement === speakButtonElement) {
            appendMessageBubble(
              "error",
              playbackError instanceof Error
                ? playbackError.message
                : "Ошибка воспроизведения",
            );
            stopSpeechPlayback();
            setStatus("ошибка", "error");
          }
        }
      }

      function isYandexBrowser() {
        return /YaBrowser/i.test(navigator.userAgent || "");
      }

      function describeMicrophoneError(microphoneError) {
        const errorName =
          microphoneError && typeof microphoneError === "object" && microphoneError.name
            ? microphoneError.name
            : "";
        const errorMessage =
          microphoneError instanceof Error
            ? microphoneError.message
            : String(microphoneError || "");
        if (
          errorName === "NotAllowedError" ||
          errorName === "PermissionDeniedError" ||
          /permission/i.test(errorMessage)
        ) {
          let userHint =
            "Микрофон запрещён для этого сайта. ";
          if (/android/i.test(navigator.userAgent || "")) {
            userHint +=
              "Android: ⋮ → «Информация о сайте» → Разрешения → Микрофон → «Разрешить». ";
            if (isYandexBrowser()) {
              userHint +=
                "Яндекс Браузер: Настройки → Сайты → ваш домен чата → Микрофон — разрешить. ";
            }
            userHint +=
              "Закройте вкладки с записью. Откройте чат по HTTPS и обновите страницу.";
          } else {
            userHint += "Разрешите микрофон для сайта в настройках браузера и обновите страницу.";
          }
          return userHint;
        }
        if (errorName === "NotFoundError") {
          return "Микрофон не найден на устройстве.";
        }
        if (errorName === "SecurityError" || window.isSecureContext !== true) {
          return "Микрофон доступен только по HTTPS (защищённое соединение).";
        }
        return errorMessage || "Не удалось открыть микрофон.";
      }

      function requestMicrophoneStream() {
        if (window.isSecureContext !== true) {
          return Promise.reject(
            Object.assign(new Error("Нужен HTTPS."), { name: "SecurityError" }),
          );
        }
        const audioConstraints = { audio: true };
        if (navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === "function") {
          return navigator.mediaDevices.getUserMedia(audioConstraints);
        }
        const legacyGetUserMedia =
          navigator.getUserMedia ||
          navigator.webkitGetUserMedia ||
          navigator.mozGetUserMedia;
        if (legacyGetUserMedia) {
          return new Promise((resolve, reject) => {
            legacyGetUserMedia.call(navigator, audioConstraints, resolve, reject);
          });
        }
        return Promise.reject(
          Object.assign(new Error("getUserMedia не поддерживается."), {
            name: "NotSupportedError",
          }),
        );
      }

      function pickVoiceRecordingMimeType() {
        if (typeof MediaRecorder === "undefined") {
          return null;
        }
        const mimeCandidates = [
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/ogg;codecs=opus",
          "audio/mp4",
          "audio/aac",
        ];
        for (const mimeCandidate of mimeCandidates) {
          if (MediaRecorder.isTypeSupported(mimeCandidate)) {
            return mimeCandidate;
          }
        }
        return null;
      }

      function createVoiceMediaRecorder(mediaStream, preferredMimeType) {
        if (preferredMimeType) {
          try {
            return new MediaRecorder(mediaStream, { mimeType: preferredMimeType });
          } catch {
            /* браузерный формат по умолчанию */
          }
        }
        return new MediaRecorder(mediaStream);
      }

      function voiceRecordingFilename(recordingMimeType) {
        const normalizedMime = (recordingMimeType || "").toLowerCase();
        if (normalizedMime.includes("ogg")) {
          return "voice.ogg";
        }
        if (normalizedMime.includes("mp4") || normalizedMime.includes("m4a") || normalizedMime.includes("aac")) {
          return "voice.m4a";
        }
        return "voice.webm";
      }

      function releaseVoiceRecordingStream() {
        if (voiceRecordingStream) {
          for (const mediaTrack of voiceRecordingStream.getTracks()) {
            mediaTrack.stop();
          }
          voiceRecordingStream = null;
        }
      }

      function blobToBase64(audioBlob) {
        return new Promise((resolve, reject) => {
          const fileReader = new FileReader();
          fileReader.onload = () => {
            const dataUrl = String(fileReader.result || "");
            const commaIndex = dataUrl.indexOf(",");
            resolve(commaIndex === -1 ? "" : dataUrl.slice(commaIndex + 1));
          };
          fileReader.onerror = () => reject(fileReader.error);
          fileReader.readAsDataURL(audioBlob);
        });
      }

      async function transcribeAndSendVoiceRecording() {
        if (voiceRecordedChunks.length === 0) {
          appendMessageBubble("error", "Запись пустая. Повторите.");
          return;
        }
        const recordingMimeType =
          voiceMediaRecorder && voiceMediaRecorder.mimeType
            ? voiceMediaRecorder.mimeType
            : "audio/webm";
        const audioBlob = new Blob(voiceRecordedChunks, { type: recordingMimeType });
        voiceRecordedChunks = [];
        if (audioBlob.size > uploadMaxBytes) {
          appendMessageBubble("error", "Голосовая запись слишком длинная.");
          return;
        }
        setStatus("распознаю…", "busy");
        const audioBase64 = await blobToBase64(audioBlob);
        const transcribeResponse = await fetch("/api/voice/transcribe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            audioBase64,
            mimeType: recordingMimeType,
            filename: voiceRecordingFilename(recordingMimeType),
          }),
        });
        const transcribeBody = await transcribeResponse.json();
        if (!transcribeResponse.ok) {
          appendMessageBubble("error", transcribeBody.error || "Ошибка распознавания речи");
          setStatus("ошибка", "error");
          return;
        }
        const recognizedText = (transcribeBody.text || "").trim();
        if (!recognizedText) {
          appendMessageBubble("error", "Пустой текст после распознавания.");
          setStatus("готов", "");
          return;
        }
        const shouldAutoSend =
          typeof transcribeBody.autoSend === "boolean" ? transcribeBody.autoSend : voiceAutoSend;
        if (shouldAutoSend) {
          await postChatStream(recognizedText, {
            replyWithSpeechAfterRun: true,
            responseMode: "voice",
          });
          return;
        }
        inputElement.value = recognizedText;
        setStatus("готов", "");
      }

      function beginVoiceRecordingWithStream(mediaStream) {
        if (typeof MediaRecorder === "undefined") {
          throw new Error("Запись голоса не поддерживается в этом браузере.");
        }
        const preferredMimeType = pickVoiceRecordingMimeType();
        voiceRecordedChunks = [];
        voiceRecordingStream = mediaStream;
        voiceMediaRecorder = createVoiceMediaRecorder(mediaStream, preferredMimeType);
        voiceMediaRecorder.ondataavailable = (recorderEvent) => {
          if (recorderEvent.data && recorderEvent.data.size > 0) {
            voiceRecordedChunks.push(recorderEvent.data);
          }
        };
        voiceMediaRecorder.onstop = () => {
          releaseVoiceRecordingStream();
          void transcribeAndSendVoiceRecording();
        };
        voiceMediaRecorder.start(300);
        isVoiceRecording = true;
        voiceRecordButton.classList.add("recording");
        voiceRecordButton.title = "Идёт запись… Нажмите для остановки и отправки";
        setStatus("запись…", "busy");
      }

      function stopVoiceRecording() {
        if (!isVoiceRecording || !voiceMediaRecorder) {
          return;
        }
        isVoiceRecording = false;
        voiceRecordButton.classList.remove("recording");
        voiceRecordButton.title =
          "Голос: нажмите — запись, ещё раз — стоп и отправить";
        if (voiceMediaRecorder.state !== "inactive") {
          voiceMediaRecorder.stop();
        }
      }

      async function toggleVoiceRecording() {
        if (isVoiceRecording) {
          stopVoiceRecording();
          return;
        }
        if (!voiceEnabled || isRequestInFlight) {
          return;
        }

        let mediaStream;
        try {
          mediaStream = await requestMicrophoneStream();
        } catch (microphoneError) {
          appendMessageBubble("error", describeMicrophoneError(microphoneError));
          setStatus("ошибка", "error");
          return;
        }

        try {
          stopSpeechPlayback();
          beginVoiceRecordingWithStream(mediaStream);
        } catch (recordingError) {
          releaseVoiceRecordingStream();
          if (mediaStream) {
            for (const mediaTrack of mediaStream.getTracks()) {
              mediaTrack.stop();
            }
          }
          appendMessageBubble(
            "error",
            recordingError instanceof Error
              ? recordingError.message
              : "Не удалось начать запись",
          );
          setStatus("ошибка", "error");
        }
      }

      function appendMessageBubble(role, text) {
        const bubbleElement = document.createElement("div");
        bubbleElement.className = "msg " + role;
        const textElement = document.createElement("span");
        textElement.className = "msg-text";
        textElement.textContent = text;
        bubbleElement.appendChild(textElement);
        if (role === "agent" && voiceEnabled) {
          const speakButtonElement = document.createElement("button");
          speakButtonElement.type = "button";
          speakButtonElement.className = "speak-btn";
          speakButtonElement.title = "Озвучить ответ (повторное нажатие — стоп)";
          speakButtonElement.textContent = "🔊";
          bindSpeakButton(speakButtonElement, textElement);
          bubbleElement.appendChild(speakButtonElement);
        }
        messagesElement.appendChild(bubbleElement);
        scrollMessagesToBottom();
        saveHistoryToStorage();
        return bubbleElement;
      }

      function appendSystemNote(text) {
        const bubbleElement = document.createElement('div');
        bubbleElement.className = "msg system";
        bubbleElement.textContent = text;
        messagesElement.appendChild(bubbleElement);
        scrollMessagesToBottom();
        return bubbleElement;
      }

      function ensureAgentBubble() {
        if (!currentAgentBubbleElement) {
          currentAgentBubbleElement = document.createElement("div");
          currentAgentBubbleElement.className = "msg agent";
          const textElement = document.createElement("span");
          textElement.className = "msg-text";
          currentAgentBubbleElement.appendChild(textElement);
          if (voiceEnabled) {
            const speakButtonElement = document.createElement("button");
            speakButtonElement.type = "button";
            speakButtonElement.className = "speak-btn";
            speakButtonElement.title = "Озвучить ответ (повторное нажатие — стоп)";
            speakButtonElement.textContent = "🔊";
            bindSpeakButton(speakButtonElement, textElement);
            currentAgentBubbleElement.appendChild(speakButtonElement);
          }
          messagesElement.appendChild(currentAgentBubbleElement);
        }
        return currentAgentBubbleElement;
      }

      function appendToolHint(text) {
        const agentBubble = ensureAgentBubble();
        const hintElement = document.createElement("div");
        hintElement.className = "tool-hint";
        hintElement.textContent = text;
        agentBubble.appendChild(hintElement);
        scrollMessagesToBottom();
      }

      function renderAttachmentChips() {
        attachListElement.innerHTML = "";
        for (const attachment of pendingAttachments) {
          const chip = document.createElement("span");
          chip.className = "attach-chip";
          chip.textContent = attachment.filename;
          attachListElement.appendChild(chip);
        }
      }

      function setComposerEnabled(enabled) {
        sendButton.disabled = !enabled;
        newChatButton.disabled = !enabled;
        resetAgentButton.disabled = !enabled;
        resetMemoryButton.disabled = !enabled;
        attachButton.disabled = !enabled;
        inputElement.disabled = !enabled;
        workspaceSelectElement.disabled = !enabled || isRequestInFlight;
        if (voiceEnabled) {
          voiceRecordButton.disabled = !enabled;
        }
      }

      async function loadServerConfig() {
        const response = await fetch("/api/config");
        if (!response.ok) {
          appendSystemNote("Не удалось загрузить список репозиториев.");
          return;
        }
        const config = await response.json();
        uploadMaxBytes = config.uploadMaxBytes || uploadMaxBytes;
        workspaceSelectElement.innerHTML = "";
        for (const workspace of config.workspaces || []) {
          const option = document.createElement("option");
          option.value = workspace.id;
          option.textContent = workspace.label || workspace.id;
          workspaceSelectElement.appendChild(option);
        }
        if (!selectedWorkspaceId && config.defaultWorkspaceId) {
          selectedWorkspaceId = config.defaultWorkspaceId;
        }
        if (selectedWorkspaceId) {
          workspaceSelectElement.value = selectedWorkspaceId;
        }
        if (config.vpnHealth && config.vpnHealth.pollIntervalMs) {
          vpnHealthPollIntervalMs = config.vpnHealth.pollIntervalMs;
        }
        if (config.voice && config.voice.enabled) {
          voiceEnabled = true;
          voiceAutoSend = config.voice.autoSend !== false;
          voiceRecordButton.hidden = false;
        } else {
          voiceEnabled = false;
          voiceRecordButton.hidden = true;
        }
      }

      workspaceSelectElement.addEventListener("change", () => {
        persistWorkspaceId(workspaceSelectElement.value);
        appendSystemNote("Репозиторий: " + workspaceSelectElement.value);
      });

      attachButton.addEventListener("click", () => {
        attachInputElement.click();
      });

      attachInputElement.addEventListener("change", async () => {
        const files = attachInputElement.files;
        if (!files || files.length === 0) {
          return;
        }
        for (const file of files) {
          if (file.size > uploadMaxBytes) {
            appendMessageBubble("error", "Файл «" + file.name + "» слишком большой.");
            continue;
          }
          const buffer = await file.arrayBuffer();
          const bytes = new Uint8Array(buffer);
          let binary = "";
          for (let index = 0; index < bytes.length; index += 1) {
            binary += String.fromCharCode(bytes[index]);
          }
          pendingAttachments.push({
            filename: file.name,
            mimeType: file.type || "application/octet-stream",
            dataBase64: btoa(binary),
          });
        }
        attachInputElement.value = "";
        renderAttachmentChips();
      });

      async function startNewChat() {
        if (isRequestInFlight) {
          return;
        }
        setComposerEnabled(false);
        try {
          const response = await fetch("/api/new-chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              sessionId: chatSessionId || undefined,
              workspaceId: workspaceSelectElement.value || selectedWorkspaceId,
            }),
          });
          const body = await response.json();
          if (!response.ok) {
            appendMessageBubble("error", body.error || "Не удалось начать новый чат");
            setStatus("ошибка", "error");
            return;
          }
          persistSessionId(body.sessionId);
          if (body.workspaceId) {
            persistWorkspaceId(body.workspaceId);
            workspaceSelectElement.value = body.workspaceId;
          }
          messagesElement.innerHTML = "";
          currentAgentBubbleElement = null;
          localStorage.removeItem(HISTORY_STORAGE_KEY);
          appendSystemNote("Новая вкладка");
          setStatus("готов", "");
        } finally {
          setComposerEnabled(true);
          inputElement.focus();
        }
      }

      function findLastAgentMessageBubble() {
        const agentBubbles = messagesElement.querySelectorAll(".msg.agent");
        if (agentBubbles.length === 0) {
          return null;
        }
        return agentBubbles[agentBubbles.length - 1];
      }

      async function autoSpeakLastAgentReply(agentBubbleElement) {
        if (!voiceEnabled || !agentBubbleElement) {
          return;
        }
        const agentTextElement = getAgentBubbleTextElement(agentBubbleElement);
        const speakButtonElement = agentBubbleElement.querySelector(".speak-btn");
        if (!agentTextElement || !speakButtonElement) {
          return;
        }
        const replyText = (agentTextElement.textContent || "").trim();
        if (!replyText) {
          return;
        }
        await handleSpeakButtonClick(speakButtonElement, agentTextElement);
      }

      async function postChatStream(presetMessageText, chatStreamOptions) {
        const messageText =
          typeof presetMessageText === "string"
            ? presetMessageText.trim()
            : inputElement.value.trim();
        const replyWithSpeechAfterRun = Boolean(
          chatStreamOptions && chatStreamOptions.replyWithSpeechAfterRun,
        );
        const chatResponseMode =
          chatStreamOptions && chatStreamOptions.responseMode === "voice"
            ? "voice"
            : "text";
        if ((!messageText && pendingAttachments.length === 0) || isRequestInFlight) {
          return;
        }

        stopSpeechPlayback();
        isRequestInFlight = true;
        currentAgentBubbleElement = null;
        setComposerEnabled(false);
        setStatus("думает…", "busy");
        let lastRunSucceeded = false;

        const attachmentSnapshot = pendingAttachments.slice();
        const displayText =
          messageText +
          (attachmentSnapshot.length
            ? "\n\n📎 " + attachmentSnapshot.map((item) => item.filename).join(", ")
            : "");
        appendMessageBubble("user", displayText);
        if (typeof presetMessageText !== "string") {
          inputElement.value = "";
        }
        pendingAttachments = [];
        renderAttachmentChips();

        const fetchResponse = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: messageText,
            sessionId: chatSessionId || undefined,
            workspaceId: workspaceSelectElement.value || selectedWorkspaceId,
            attachments: attachmentSnapshot,
            responseMode: chatResponseMode,
          }),
        });

        const responseSessionHeader = fetchResponse.headers.get("X-Chat-Session-Id");
        if (responseSessionHeader) {
          persistSessionId(responseSessionHeader);
        }
        const responseWorkspaceHeader = fetchResponse.headers.get("X-Chat-Workspace-Id");
        if (responseWorkspaceHeader) {
          persistWorkspaceId(responseWorkspaceHeader);
          workspaceSelectElement.value = responseWorkspaceHeader;
        }

        if (!fetchResponse.ok) {
          const errorBodyText = await fetchResponse.text();
          let errorMessage = errorBodyText;
          try {
            const parsed = JSON.parse(errorBodyText);
            errorMessage = parsed.error || errorBodyText;
          } catch {
            /* plain text */
          }
          appendMessageBubble("error", errorMessage);
          setStatus("ошибка", "error");
          isRequestInFlight = false;
          currentAgentBubbleElement = null;
          setComposerEnabled(true);
          return;
        }

        const responseBodyReader = fetchResponse.body.getReader();
        const textDecoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const readResult = await responseBodyReader.read();
          if (readResult.done) {
            break;
          }
          buffer += textDecoder.decode(readResult.value, { stream: true });
          let lineBreakIndex = buffer.indexOf("\n");
          while (lineBreakIndex !== -1) {
            const line = buffer.slice(0, lineBreakIndex).trimEnd();
            buffer = buffer.slice(lineBreakIndex + 1);
            if (line.startsWith("data:")) {
              const jsonPayloadText = line.slice(5).trim();
              try {
                const event = JSON.parse(jsonPayloadText);
                if (event.kind === "session" && event.sessionId) {
                  persistSessionId(event.sessionId);
                }
                if (event.kind === "session" && event.workspaceId) {
                  persistWorkspaceId(event.workspaceId);
                } else if (event.kind === "assistant_text") {
                  const agentBubble = ensureAgentBubble();
                  const agentTextElement = getAgentBubbleTextElement(agentBubble);
                  if (agentTextElement) {
                    agentTextElement.textContent += event.text;
                  }
                  scrollMessagesToBottom();
                  saveHistoryToStorage();
                } else if (event.kind === "tool_call") {
                  const label =
                    event.status === "running"
                      ? "▶ " + event.name
                      : event.status === "completed"
                        ? "✓ " + event.name
                        : "✗ " + event.name;
                  appendToolHint(label);
                } else if (event.kind === "run_finished") {
                  lastRunSucceeded = event.status !== "error";
                  if (event.status === "error") {
                    appendMessageBubble("error", "Агент завершил run со статусом error");
                    setStatus("ошибка", "error");
                  } else if (!replyWithSpeechAfterRun) {
                    setStatus("готов", "");
                  }
                  saveHistoryToStorage();
                } else if (event.kind === "error") {
                  appendMessageBubble("error", event.message);
                  setStatus("ошибка", "error");
                  saveHistoryToStorage();
                }
              } catch {
                /* ignore malformed sse chunk */
              }
            }
            lineBreakIndex = buffer.indexOf("\n");
          }
        }

        const agentBubbleForAutoSpeech =
          currentAgentBubbleElement || findLastAgentMessageBubble();

        isRequestInFlight = false;
        setComposerEnabled(true);

        if (lastRunSucceeded && replyWithSpeechAfterRun && voiceEnabled) {
          await autoSpeakLastAgentReply(agentBubbleForAutoSpeech);
        } else if (statusPillElement.className !== "error" && !activeSpeakButtonElement) {
          setStatus("готов", "");
        }

        currentAgentBubbleElement = null;
        inputElement.focus();
      }

      sendButton.addEventListener("click", () => {
        void postChatStream();
      });

      voiceRecordButton.addEventListener("click", () => {
        void toggleVoiceRecording();
      });

      newChatButton.addEventListener("click", () => {
        void startNewChat();
      });

      async function resetWorkspaceMemory() {
        if (isRequestInFlight) {
          return;
        }
        if (!confirm("Сбросить долгосрочную память для текущего workspace?")) {
          return;
        }
        setComposerEnabled(false);
        try {
          const response = await fetch("/api/reset-memory", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              workspaceId: workspaceSelectElement.value || selectedWorkspaceId,
            }),
          });
          const body = await response.json();
          if (!response.ok) {
            appendMessageBubble("error", body.error || "Не удалось сбросить память");
            setStatus("ошибка", "error");
            return;
          }
          messagesElement.innerHTML = "";
          currentAgentBubbleElement = null;
          localStorage.removeItem(HISTORY_STORAGE_KEY);
          appendSystemNote("Память workspace сброшена · " + (body.workspaceId || selectedWorkspaceId));
          setStatus("готов", "");
        } finally {
          setComposerEnabled(true);
        }
      }

      async function resetWorkspaceAgent(forceReset) {
        if (isRequestInFlight && !forceReset) {
          return;
        }
        if (
          !confirm(
            forceReset
              ? "Принудительно сбросить агента? (память сохранится)"
              : "Сбросить агента workspace? (память сохранится)",
          )
        ) {
          return;
        }
        setComposerEnabled(false);
        try {
          const response = await fetch("/api/reset-agent", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              workspaceId: workspaceSelectElement.value || selectedWorkspaceId,
              force: forceReset === true,
            }),
          });
          const body = await response.json();
          if (!response.ok) {
            appendMessageBubble("error", body.error || "Не удалось сбросить агента");
            setStatus("ошибка", "error");
            return;
          }
          appendSystemNote(
            "Агент сброшен · " +
              (body.workspaceId || selectedWorkspaceId) +
              " · следующий запрос создаст нового",
          );
          setStatus("готов", "");
        } finally {
          setComposerEnabled(true);
        }
      }

      resetAgentButton.addEventListener("click", () => {
        void resetWorkspaceAgent(true);
      });

      resetMemoryButton.addEventListener("click", () => {
        void resetWorkspaceMemory();
      });

      inputElement.addEventListener("keydown", (keyboardEvent) => {
        if (keyboardEvent.key === "Enter" && !keyboardEvent.shiftKey) {
          keyboardEvent.preventDefault();
          void postChatStream();
        }
      });

      async function bootstrap() {
        await loadServerConfig();
        startVpnHealthPolling();
        const historyMessages = loadHistoryFromStorage();
        if (!chatSessionId) {
          await startNewChat();
          return;
        }
        if (historyMessages.length > 0) {
          renderHistoryMessages(historyMessages);
        }
        setStatus("готов", "");
      }

      void bootstrap();
    </script>
  </body>
</html>
